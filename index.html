<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Onboarding guiado do Rook System, com apresentação institucional e diagnóstico de ponto de equilíbrio."
    />
    <meta name="theme-color" content="#2f1b0f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Onboarding Rook System</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Onboarding Rook — início">
          <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
            <path d="M24 4 44 24 24 44 4 24 24 4Zm0 6.5L10.5 24 24 37.5 37.5 24 24 10.5Z" />
            <path d="m24 13 11 11-11 11-11-11 11-11Z" opacity=".58" />
          </svg>
          <span>
            <strong>ROOK</strong>
            <small>Onboarding do cliente</small>
          </span>
        </a>

        <nav class="topbar-actions" aria-label="Ações do onboarding">
          <button class="button button-secondary" id="refresh-presentation" type="button">
            Atualizar apresentação
          </button>
          <a class="button button-primary" href="/diagnostico/">Abrir diagnóstico</a>
        </nav>
      </header>

      <main class="presentation-area">
        <section class="presentation-frame" aria-labelledby="presentation-title">
          <div class="presentation-meta">
            <div>
              <p class="eyebrow">Treinamento guiado</p>
              <h1 id="presentation-title">Conhecendo o Rook</h1>
            </div>
            <p class="status" id="presentation-status" role="status" aria-live="polite">
              Conteúdo sincronizado com a apresentação oficial
            </p>
          </div>

          <div class="viewer-shell">
            <div class="viewer-loading" id="viewer-loading" aria-hidden="true">
              <span></span>
              <p>Carregando apresentação oficial…</p>
            </div>
            <iframe
              id="presentation-viewer"
              title="Apresentação de onboarding do Rook System"
              src="https://docs.google.com/presentation/d/1UrA7-1Z-57ZhVw8vRkNZ6h7jvc-zpsZWq2TjlH7kUfc/embed?start=false&amp;loop=false&amp;delayms=60000"
              width="1280"
              height="720"
              loading="eager"
              allowfullscreen
              referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>
          </div>

          <div class="viewer-footer">
            <p>Use as setas do teclado ou os controles do player para navegar.</p>
            <a href="/gestao/">Gerenciar conteúdo</a>
          </div>
        </section>
      </main>
    </div>

    <noscript>
      <div class="noscript-message">
        Ative o JavaScript para atualizar a apresentação sem recarregar a página.
      </div>
    </noscript>

    <script src="/app.js" defer></script>
  </body>
</html>
